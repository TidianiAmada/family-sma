currency: XOF
wage_scale: 1.0                  # multiplicateur appliqué à TOUS les salaires (facteur de budget_pressure, E6/E8)
employment:
  min_work_age: 15               # âge minimal pour passer de STUDENT/DROPPED_OUT à UNEMPLOYED (10 §3)
wages:                           # salaire mensuel à plein temps à t0 (× wage_scale)
  father: 258918                 # DIRECT — salaire moyen, hommes salariés État/collectivités (EHCVM 2018/19)
  mother: 76963                  # DIRECT — salaire moyen, femmes salariées du privé (EHCVM 2018/19)
  young_adult: 60000             # quand employé
default_wage_key: young_adult    # salaire des membres sans wage_key (10 §20.3, décision J1)
wage_growth_annual: 0.02
income_shocks:
  formal:   { p_loss_monthly: 0.004, p_find_monthly: 0.05 }
  informal: { p_loss_monthly: 0.010, p_find_monthly: 0.10, volatility: 0.15 }  # revenu informel × m, m ~ LogNormal(−σ²/2, σ), E[m] = 1 (10 §20.1)
  find_formal_share: 0.2         # part des retours à l'emploi qui sont formels
tax:
  formal_rate: 0.10              # PLACEHOLDER
  informal_rate: 0.0
prices:
  inflation_annual: 0.02
consumption_requirements:        # r_k(âge) : coût mensuel pour satisfaction = 1 (FCFA, prix t0)
  food:      { by_age: [[0, 15000], [5, 22000], [13, 30000], [18, 35000], [60, 30000]] }
  health:    { routine_by_age: [[0, 3000], [5, 2000], [18, 3000], [50, 6000]], episode_cost: [[0, 25000], [18, 40000]] }
  education: { by_age: [[5, 5045]] }   # DIRECT — 60 539 FCFA/élève/an ÷ 12, arrondi au franc (EHCVM 2018/19)
  rest:      { by_age: [[0, 0]] }    # non monétaire
housing:
  monthly_cost_household: 69725  # DIRECT dérivé — loyer 53 616 + (électricité 139 964 + eau 53 348) ÷ 12, arrondi
  equivalence_scale: oecd_modified
  equivalence_weights: { first_adult: 1.0, other_adult: 0.5, child: 0.3, adult_age: 14 }
public:
  inkind_by_age:                 # Cg : consommation publique en nature (PUBLIC_INKIND)
    education: [[6, 6000], [12, 9000], [16, 12000]]   # si ENROLLED
    health:    [[0, 2000], [5, 1000], [60, 3000]]
  cash_transfers: []             # surchargé par le scénario family_allowance
  # schéma d'un élément de cash_transfers :
  #   { from_step: int, to_step: int | null, per_child_under: int | null (âge, années),
  #     amount: FCFA/mois (par enfant éligible si per_child_under, sinon par foyer), to: pot | wallet }
health:
  p_episode_monthly_by_age: [[0, 0.06], [5, 0.03], [18, 0.02], [50, 0.04]]
  episode_severity: { mean: 0.25, sd: 0.10, min: 0.05, max: 0.9 }   # perte de santé en début d'épisode (tirage tronqué)
  recovery_with_care: 0.15       # santé regagnée / mois si soin alloué
  recovery_without_care: 0.03
  natural_recovery: 0.01         # récupération mensuelle hors épisode
  recovery_tolerance: 0.05       # guérison si santé ≥ santé pré-épisode − tolérance
  max_episode_months: 6          # durée maximale d'un épisode
  health_min_for_work: 0.3       # h_min dans labor_capacity
  care_paid_by: household        # household | gov — gov ⇒ soins payés en PUBLIC_INKIND (scénario free_care, via policy_change daté)
schooling:
  entry_age: 6
  exit_age: { secondary: 19, tertiary: 25 }
  drop_after_refused_months: 3   # m_drop (V1 : mécanique)
poverty_line_per_eq: 35000       # FCFA/mois/équivalent-adulte — PLACEHOLDER (reste-à-vivre, rav_per_eq)
poverty_line_per_capita_annual: 333440   # DIRECT — seuil national par tête (EHCVM 2018/19) ; taux de pauvreté P6 (J2)
provenance: PLACEHOLDER          # valeur par défaut du fichier ; exceptions sourcées ci-dessous (J3)
provenance_by_path:              # provenance valeur par valeur (chemins relatifs à economic_params)
  wages.father:
    provenance: DIRECT
    source: "ANSD (2021), Rapport final EHCVM Sénégal, données 2018/2019, Tableau VII-12, p. 82 : salaire moyen mensuel, État/collectivités locales, colonne Hommes"
    note: "valeur par sexe (J6 ; ensemble : 247 202) ; salariés seulement ; brut/net non précisé ; père = salarié du public (J3) ; FCFA 2018/2019 non déflatés"
  wages.mother:
    provenance: DIRECT
    source: "ANSD (2021), Rapport final EHCVM Sénégal, données 2018/2019, Tableau VII-12, p. 82 : salaire moyen mensuel, entreprise privée, colonne Femmes"
    note: "valeur par sexe (J6 ; ensemble : 94 140) ; salariés seulement ; revenu informel non publié ; mère = salariée du privé (J3) ; FCFA 2018/2019 non déflatés"
  consumption_requirements.education.by_age:
    provenance: DIRECT
    source: "ANSD (2021), Rapport final EHCVM Sénégal, données 2018/2019, Tableau V-8, p. 55 : dépense moyenne d'éducation par élève, ensemble, 60 539 FCFA/an"
    note: "mensualisé (÷ 12) et arrondi au franc ; aucune ventilation par âge ni cycle publiée : montant unique à tous les âges scolaires ; FCFA 2018/2019 non déflatés"
  housing.monthly_cost_household:
    provenance: DIRECT
    source: "ANSD (2021), Rapport final EHCVM Sénégal, données 2018/2019, Graphique VIII-3, p. 100 (loyer moyen des locataires, 53 616 FCFA/mois) ; Tableaux VIII-7 et VIII-8 (électricité 139 964 et eau 53 348 FCFA/an)"
    note: "valeur DÉRIVÉE : somme de moyennes de sous-populations différentes (loyer des seuls locataires, 17,8 % des ménages ; électricité pour les ménages raccordés) ; énergie et eau mensualisées ; arrondi au franc ; FCFA 2018/2019 non déflatés"
  poverty_line_per_capita_annual:
    provenance: DIRECT
    source: "ANSD (2021), Rapport final EHCVM Sénégal, données 2018/2019, p. v : seuil de pauvreté national, 333 440 FCFA par an et par tête"
    note: "bien-être = consommation par tête, sans échelle d'équivalence (p. 20) : seuil du taux de pauvreté par tête de la cible P6 (J2)" 
